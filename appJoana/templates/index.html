<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django da Joana</title>

    <style>
        body{
            background-color: rgb(204, 211, 228);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        input{
            border-radius: 5px;
            height: 20px;
            width: 250px;
        }

        
        form{
            gap: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            align-items: center;
        }

        .Enviar{
            width: 60px;
        }

        #retorno{
            background-color: rgb(242, 243, 248);
            border-radius: 30px;
            border: 0.5px solid rgb(95, 100, 100);
            padding: 10px;
        }

    </style>

</head>
<body>
    <h1>Atividade</h1>

    <div class="aula"></div>
        <!-- action="." pra onde vou mandar os dados do form ("." mesmo local do arquivo) -->
        <!-- method="POST" método pelo qual vou enviar os dados -->
        <form action="." method="POST">

            <!-- csrf_token é para proteção de xsite_scripting -->
            {% csrf_token %}

            <label from="nome">Digite o seu nome</label>
            <input type="text", id="nome" name="InputNome" placeholder="Nome">
            <!-- <button type="submit">Enviar</button> (OUTRA FORMA DE CRIAR BOTÃO) -->

            <label from="idade">Digite sua idade</label>
            <input type="number" name="InputIdade" id="idade" placeholder="Digite sua idade">

            <input class="Enviar" type="submit" value="Enviar"> 

        </form>

        {% if nome %}
            <p id="retorno">Olá {{nome}}, você tem {{idade}} anos!</p>
        {% endif %}

    </div>

</body>
</html>
