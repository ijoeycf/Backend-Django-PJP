<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django da Joana</title>

    <style>
        body{
            background-color: rgb(204, 211, 228);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        input{
            border-radius: 5px;
            height: 20px;
            width: 250px;
        }

        
        form{
            gap: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            align-items: center;
        }

        .Enviar{
            width: 60px;
        }

        #retorno{
            background-color: rgb(242, 243, 248);
            border-radius: 30px;
            border: 0.5px solid rgb(95, 100, 100);
            padding: 10px;
        }

        h2{
            text-align: center;
        }

        h3{
            text-align: center;
        }

    </style>

</head>
<body>
    <h2>Atividade</h2>

    <div class="aula"></div>
        <form action="." method="POST">

            {% csrf_token %}

            <label from="idade">Digite um número</label>
            <input type="number" name="InputNumero" id="numero" placeholder="Digite aqui">

            <input class="Enviar" type="submit" value="Enviar"> 

        </form>

        {% if numero %}
            <h3>Tabuada do {{numero}}</h3>
            <div class="tabuada">
                {% for i in tabuada%}
                    <p>{{i}} * {{numero}} = {{i}}</p>   
                {% endfor %} 
        {% endif %}
            </div>
    </div>


</body>
</html>
